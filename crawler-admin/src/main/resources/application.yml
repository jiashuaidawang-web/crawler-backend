    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://100.92.86.64:15432/postgres
    username: dbuser
    password: OpenGauss@2026
    # 分析型数据源：ClickHouse（行情 / 池子 / 龙虎榜 / 资金流，批量追加 + ReplacingMergeTree）
