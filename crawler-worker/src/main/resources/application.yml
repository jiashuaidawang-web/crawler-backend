server:
  port: 8080

spring:
  application:
    name: crawler-worker
  datasource:
    # 主数据源：openGauss（操作型表 crawl_* / trade_log）—— 默认前缀，Spring Boot 自动配置（和改前一致）
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://100.97.74.45:5432/postgres
    username: dbuser
    password: OpenGauss@2026
    # 分析型数据源：ClickHouse（行情 / 池子 / 龙虎榜 / 资金流，批量追加 + ReplacingMergeTree）
    ch:
      driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
      jdbc-url: jdbc:clickhouse://100.97.74.45:8123/crawler?compress=0&use_server_time_zone=false&rewrite_batch_inserts=true
      username: default
      password: pamirs@123

crawler:
  node-id: ${HOSTNAME:worker-node-1}
  node-name: Worker-1
  role: MIXED          # API / BROWSER / MIXED
  ip: 127.0.0.1
  batch: 10
  claim-fixed-delay-ms: 5000
  proxy:
    agent: qingguo

anti-crawl:
  rate-limit-per-sec: 5.0
  proxy-enabled: false
  ua-pool:
    - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  proxy-list: []
  stealth-mode: NONE
  cloak-humanize: true
  cloak-local-port: 9222
  cloak-serve-script: scripts/cloak_serve.py

# 日志级别（排查数据问题时把 eastmoney / DedupWriter 改成 DEBUG）
logging:
  level:
    com.dunwugudao.crawler.strategy.eastmoney: INFO
    com.dunwugudao.crawler.persistence.service.DedupWriter: INFO

# 代理配置(统一用青果长效)
proxy:
  qg:
    auth-key: 2E4CFAB9
    business-id: es6qa9xd
    password: 1F6D9267F1C2
